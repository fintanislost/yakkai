name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build release packages
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install base tools for checkout
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel \
            cmake \
            extra-cmake-modules \
            ffmpeg \
            github-cli \
            kdeclarative \
            kirigami \
            kpackage \
            lz4 \
            plasma5support \
            qt6-base \
            qt6-declarative \
            qt6-multimedia \
            qt6-shadertools \
            qt6-webengine \
            vulkan-headers \
            vulkan-icd-loader

      - name: Mark checkout as safe for Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package release assets
        run: |
          bash scripts/package-release.sh \
            --output-dir dist \
            --version "$GITHUB_REF_NAME" \
            --target archlinux-x86_64 \
            --source-ref "$GITHUB_SHA"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
