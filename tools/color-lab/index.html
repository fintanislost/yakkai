<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WE Scene Color Lab</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; padding: 16px; }
h1 { font-size: 18px; margin-bottom: 8px; color: #7ec8e3; }
.layout { display: flex; gap: 16px; flex-wrap: wrap; }
.panel { background: #16213e; border: 1px solid #334; border-radius: 8px; padding: 12px; }
.preview-panel { flex: 1; min-width: 300px; }
.controls-panel { width: 320px; }
.compare { display: flex; gap: 8px; margin-bottom: 12px; }
.compare img, .compare canvas { max-width: 100%; border: 1px solid #334; border-radius: 4px; }
label { display: block; font-size: 12px; margin: 8px 0 2px; color: #aaa; }
input[type=range] { width: 100%; }
.value { float: right; color: #7ec8e3; font-size: 12px; }
select { width: 100%; padding: 4px; background: #1a1a2e; color: #e0e0e0; border: 1px solid #334; border-radius: 4px; }
.texture-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.texture-grid img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; border: 2px solid transparent; border-radius: 4px; }
.texture-grid img.active { border-color: #7ec8e3; }
.section { margin-top: 12px; padding-top: 8px; border-top: 1px solid #334; }
.btn { padding: 4px 12px; background: #334; color: #e0e0e0; border: 1px solid #556; border-radius: 4px; cursor: pointer; margin: 2px; }
.btn:hover { background: #445; }
.btn.active { background: #7ec8e3; color: #1a1a2e; }
canvas { image-rendering: pixelated; }
#info { font-size: 11px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<h1>WE Scene Color Lab — 3476236738</h1>

<div class="layout">
  <div class="panel preview-panel">
    <div class="compare">
      <div style="flex:1">
        <label>Target (preview.gif)</label>
        <img id="preview" src="preview.gif" style="width:100%">
      </div>
      <div style="flex:1">
        <label>Simulated render</label>
        <canvas id="render" style="width:100%"></canvas>
      </div>
    </div>
    <label>Selected texture</label>
    <canvas id="texView" style="width:100%; max-height:300px; object-fit:contain"></canvas>
    <div id="info"></div>
  </div>

  <div class="panel controls-panel">
    <label>Texture <span class="value" id="texName">—</span></label>
    <div class="texture-grid" id="texGrid"></div>

    <div class="section">
      <label>g_Color4 R <span class="value" id="vR">1.00</span></label>
      <input type="range" id="sR" min="0" max="1" step="0.01" value="1">
      <label>g_Color4 G <span class="value" id="vG">1.00</span></label>
      <input type="range" id="sG" min="0" max="1" step="0.01" value="1">
      <label>g_Color4 B <span class="value" id="vB">1.00</span></label>
      <input type="range" id="sB" min="0" max="1" step="0.01" value="1">
      <label>g_Color4 Alpha <span class="value" id="vA">1.00</span></label>
      <input type="range" id="sA" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="section">
      <label>Clear Color R <span class="value" id="vCR">0.49</span></label>
      <input type="range" id="sCR" min="0" max="1" step="0.01" value="0.49">
      <label>Clear Color G <span class="value" id="vCG">0.53</span></label>
      <input type="range" id="sCG" min="0" max="1" step="0.01" value="0.53">
      <label>Clear Color B <span class="value" id="vCB">0.65</span></label>
      <input type="range" id="sCB" min="0" max="1" step="0.01" value="0.65">
    </div>

    <div class="section">
      <label>Brightness <span class="value" id="vBright">-0.06</span></label>
      <input type="range" id="sBright" min="-0.5" max="0.5" step="0.01" value="-0.06">
      <label>Contrast <span class="value" id="vContrast">0.08</span></label>
      <input type="range" id="sContrast" min="-0.5" max="0.5" step="0.01" value="0.08">
      <label>Gamma <span class="value" id="vGamma">1.00</span></label>
      <input type="range" id="sGamma" min="0.3" max="3.0" step="0.01" value="1.0">
    </div>

    <div class="section">
      <label>Blend mode</label>
      <select id="blendMode">
        <option value="translucent" selected>Translucent (srcA*src + (1-srcA)*dst)</option>
        <option value="normal">Normal (overwrite)</option>
        <option value="additive">Additive (src + dst)</option>
        <option value="premultiply">Premultiplied alpha</option>
      </select>
      <label>sRGB decode <span class="value" id="vSrgb">off</span></label>
      <div>
        <button class="btn" id="btnSrgbOff" onclick="setSrgb(false)">UNORM (linear)</button>
        <button class="btn" id="btnSrgbOn" onclick="setSrgb(true)">sRGB decode</button>
      </div>
    </div>

    <div class="section">
      <button class="btn" onclick="resetDefaults()">Reset defaults</button>
      <button class="btn" onclick="matchPreview()">Match preview colors</button>
    </div>
  </div>
</div>

<script>
const TEXTURES = [
  '窗户', '桌', '1', '2', '111', '222', '333',
  '衣', '衣2', '右窗帘', '左窗', '椅子', '左椅',
  '桌2', '桌左', '围巾', '领带', '领带22', '影', '图层 2'
];

let currentTex = null;
let texImages = {};
let useSrgb = false;

// Load all thumbnails
const grid = document.getElementById('texGrid');
TEXTURES.forEach(name => {
  const img = document.createElement('img');
  img.src = `textures/${name}_thumb.png`;
  img.title = name;
  img.onclick = () => selectTexture(name);
  grid.appendChild(img);

  // Preload full texture
  const full = new Image();
  full.src = `textures/${name}.png`;
  full.onload = () => { texImages[name] = full; };
});

function selectTexture(name) {
  currentTex = name;
  document.getElementById('texName').textContent = name;
  grid.querySelectorAll('img').forEach(i => i.classList.toggle('active', i.title === name));
  render();
}

function srgbToLinear(v) {
  return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
}

function linearToSrgb(v) {
  return v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1/2.4) - 0.055;
}

function render() {
  if (!currentTex || !texImages[currentTex]) return;

  const img = texImages[currentTex];
  const texCanvas = document.getElementById('texView');
  const renderCanvas = document.getElementById('render');

  // Draw raw texture
  texCanvas.width = img.width;
  texCanvas.height = img.height;
  const tctx = texCanvas.getContext('2d');
  tctx.drawImage(img, 0, 0);

  // Get parameters
  const gR = parseFloat(document.getElementById('sR').value);
  const gG = parseFloat(document.getElementById('sG').value);
  const gB = parseFloat(document.getElementById('sB').value);
  const gA = parseFloat(document.getElementById('sA').value);
  const cR = parseFloat(document.getElementById('sCR').value);
  const cG = parseFloat(document.getElementById('sCG').value);
  const cB = parseFloat(document.getElementById('sCB').value);
  const brightness = parseFloat(document.getElementById('sBright').value);
  const contrast = parseFloat(document.getElementById('sContrast').value);
  const gamma = parseFloat(document.getElementById('sGamma').value);
  const blendMode = document.getElementById('blendMode').value;

  // Process at reduced resolution for speed
  const scale = Math.min(1, 600 / Math.max(img.width, img.height));
  const w = Math.floor(img.width * scale);
  const h = Math.floor(img.height * scale);

  renderCanvas.width = w;
  renderCanvas.height = h;
  const rctx = renderCanvas.getContext('2d');

  // Draw texture scaled
  rctx.drawImage(img, 0, 0, w, h);
  const imageData = rctx.getImageData(0, 0, w, h);
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i] / 255;
    let g = data[i+1] / 255;
    let b = data[i+2] / 255;
    let a = data[i+3] / 255;

    // sRGB decode (if enabled)
    if (useSrgb) {
      r = srgbToLinear(r);
      g = srgbToLinear(g);
      b = srgbToLinear(b);
    }

    // Apply g_Color4 multiply
    r *= gR;
    g *= gG;
    b *= gB;
    a *= gA;

    // Color grading: brightness + contrast
    r = r * (brightness + 1);
    g = g * (brightness + 1);
    b = b * (brightness + 1);
    r = (r - 0.5) * (contrast + 1) + 0.5;
    g = (g - 0.5) * (contrast + 1) + 0.5;
    b = (b - 0.5) * (contrast + 1) + 0.5;

    // Gamma
    if (gamma !== 1.0) {
      r = Math.pow(Math.max(0, r), gamma);
      g = Math.pow(Math.max(0, g), gamma);
      b = Math.pow(Math.max(0, b), gamma);
    }

    // sRGB encode back (if we decoded)
    if (useSrgb) {
      r = linearToSrgb(r);
      g = linearToSrgb(g);
      b = linearToSrgb(b);
    }

    // Blend with clear color
    let outR, outG, outB;
    if (blendMode === 'translucent') {
      outR = a * r + (1 - a) * cR;
      outG = a * g + (1 - a) * cG;
      outB = a * b + (1 - a) * cB;
    } else if (blendMode === 'normal') {
      outR = r; outG = g; outB = b;
    } else if (blendMode === 'additive') {
      outR = r + cR; outG = g + cG; outB = b + cB;
    } else if (blendMode === 'premultiply') {
      outR = r + (1 - a) * cR;
      outG = g + (1 - a) * cG;
      outB = b + (1 - a) * cB;
    }

    data[i] = Math.max(0, Math.min(255, outR * 255));
    data[i+1] = Math.max(0, Math.min(255, outG * 255));
    data[i+2] = Math.max(0, Math.min(255, outB * 255));
    data[i+3] = 255; // always opaque output
  }

  rctx.putImageData(imageData, 0, 0);

  // Update info
  document.getElementById('info').textContent =
    `${currentTex}: ${img.width}x${img.height} | g_Color4=(${gR},${gG},${gB},${gA}) | clear=(${cR},${cG},${cB}) | blend=${blendMode}`;
}

// Slider bindings
['sR','sG','sB','sA','sCR','sCG','sCB','sBright','sContrast','sGamma'].forEach(id => {
  const el = document.getElementById(id);
  const valId = 'v' + id.substring(1);
  el.addEventListener('input', () => {
    const valEl = document.getElementById(valId);
    if (valEl) valEl.textContent = parseFloat(el.value).toFixed(2);
    render();
  });
});

document.getElementById('blendMode').addEventListener('change', render);

function setSrgb(on) {
  useSrgb = on;
  document.getElementById('vSrgb').textContent = on ? 'on' : 'off';
  document.getElementById('btnSrgbOn').classList.toggle('active', on);
  document.getElementById('btnSrgbOff').classList.toggle('active', !on);
  render();
}

function resetDefaults() {
  document.getElementById('sR').value = 1;
  document.getElementById('sG').value = 1;
  document.getElementById('sB').value = 1;
  document.getElementById('sA').value = 1;
  document.getElementById('sCR').value = 0.49;
  document.getElementById('sCG').value = 0.53;
  document.getElementById('sCB').value = 0.65;
  document.getElementById('sBright').value = -0.06;
  document.getElementById('sContrast').value = 0.08;
  document.getElementById('sGamma').value = 1.0;
  setSrgb(false);
  document.querySelectorAll('input[type=range]').forEach(el => el.dispatchEvent(new Event('input')));
}

function matchPreview() {
  // Preset that approximates the preview's color balance
  document.getElementById('sR').value = 1;
  document.getElementById('sG').value = 1;
  document.getElementById('sB').value = 1;
  document.getElementById('sA').value = 1;
  document.getElementById('sCR').value = 0.28;
  document.getElementById('sCG').value = 0.36;
  document.getElementById('sCB').value = 0.60;
  document.getElementById('sBright').value = -0.06;
  document.getElementById('sContrast').value = 0.08;
  document.getElementById('sGamma').value = 1.0;
  setSrgb(false);
  document.querySelectorAll('input[type=range]').forEach(el => el.dispatchEvent(new Event('input')));
}

// Auto-select first texture
setTimeout(() => selectTexture('窗户'), 500);
setSrgb(false);
</script>
</body>
</html>
